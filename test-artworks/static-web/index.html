<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>ChromaFlow // Generative Field (ExhibitOS Test Artwork)</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="canvas"></canvas>

  <div id="hud" class="hud-container">
    <div class="hud-header">
      <span class="hud-badge">ExhibitOS Test Artwork</span>
      <span class="hud-type">Static Web</span>
    </div>
    <h1 class="hud-title">ChromaFlow</h1>
    <div class="hud-subtitle">Harmonic Generative Vector Field</div>
    <div class="hud-stats">
      <div class="stat-item"><span class="stat-label">FPS</span><span id="fps" class="stat-value">60</span></div>
      <div class="stat-item"><span class="stat-label">Particles</span><span id="particles-count" class="stat-value">--</span></div>
      <div class="stat-item"><span class="stat-label">Palette</span><span id="palette-name" class="stat-value">Deep Nebula</span></div>
      <div class="stat-item"><span class="stat-label">Uptime</span><span id="uptime" class="stat-value">00:00:00</span></div>
    </div>
    <div class="hud-hint">Touch, click, or move mouse to interact &bull; Press [H] to hide HUD</div>
  </div>

  <script src="artwork.js"></script>
</body>
</html>
